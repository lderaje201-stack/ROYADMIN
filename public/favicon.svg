<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Main Symbol Group -->
  <g filter="url(#shadow)">
    <!-- Crown on Top -->
    <path d="M 186 165 L 216 195 L 256 145 L 296 195 L 326 165 L 316 215 L 196 215 Z" fill="url(#goldGrad)" />
    <circle cx="186" cy="155" r="8" fill="url(#goldGrad)" />
    <circle cx="256" cy="135" r="10" fill="url(#goldGrad)" />
    <circle cx="326" cy="155" r="8" fill="url(#goldGrad)" />

    <!-- Stylized Tooth Body -->
    <path d="M 180 230 C 180 190, 332 190, 332 230 C 332 280, 320 310, 305 360 C 295 390, 275 390, 268 350 C 262 315, 250 315, 244 350 C 237 390, 217 390, 207 360 C 192 310, 180 280, 180 230 Z" fill="url(#toothGrad)" />

    <!-- Inner Tooth Shimmer Line -->
    <path d="M 210 235 C 210 215, 240 215, 256 220" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
